<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="canonical" href="{{ request.url }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Výklad tarotu">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%23D4AF37%22>✦</text></svg>">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">

<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/static/og-universal.png">

{% if ga_id or ads_id %}
<!-- Globálny tag (gtag.js) -->
{# Načítame knižnicu pomocou prvého dostupného ID #}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_id if ga_id else ads_id }}"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    {% if ga_id %}
        gtag('config', '{{ ga_id }}');
    {% endif %}
</script>
    {% if ads_id %}
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ ads_id }}" crossorigin="anonymous"></script>
    {% endif %}

{% endif %}
